        .IMGE {

        body {
            width: 1080px;
            height: 1080px;
            margin: 0;
            overflow: hidden;
            background: black;
        }


        @keyframes SHOWTIME {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(25);
            }
        }

        @keyframes textmove {
            from {
                transform: translateY(10000px);
                opacity: 0;
            }
            to {
                transform: translateY(1);
                opacity: 1;
            }

        }
        @keyframes Beating {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }
