<!DOCTYPE html>
<html>

<head>
    <title>MAIN</title>

    <style>



        h1 {
            position: absolute;
            left: 50%;
            top: 5%;

            transform: translateX(-50%);

            font-family: 'Franklin Gothic Medium',
                         'Arial Narrow',
                         Arial,
                         sans-serif;

            color: rgb(0, 255, 242);

            z-index: 10;

            margin: 0;

            text-shadow:
                0 0 10px rgb(0, 255, 242),
                0 0 20px rgb(0, 255, 242);

            animation: titleAppear 2s ease forwards;
        }




        body {
            width: 1920px;
            height: 1080px;

            margin: 0;

            overflow: hidden;

            background: black;
        }




        #bgvideo {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            z-index: -10;
        }




        .imageBox {
            position: absolute;

            width: 100px;
            height: 100px;

            perspective: 800px;

            animation:
                SHOWTIME 3s ease forwards;
        }




        .IMGE {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 10%;

            cursor: pointer;

            transition:
                transform 0.6s ease,
                box-shadow 0.6s ease,
                border-radius 0.6s ease;

            box-shadow:
                0 0 10px rgba(0, 255, 242, 0.5);
        }




        .imageBox:hover .IMGE {

            transform:
                perspective(600px)
                rotateY(30deg)
                rotateX(10deg)
                scale(1.3);

            border-radius: 20%;

            box-shadow:
                0 0 20px rgb(0, 255, 242),
                0 0 40px rgb(0, 255, 242);
        }




        #imgONE {
            left: 20%;
            bottom: 33%;
        }

        #imgTWO {
            left: 20%;
            bottom: 66%;
        }

        #imgTHREE {
            left: 80%;
            bottom: 33%;
        }

        #imgFOUR {
            left: 80%;
            bottom: 66%;
        }




        @keyframes SHOWTIME {

            from {
                opacity: 0;

                transform:
                    scale(0.01)
                    rotateY(90deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    rotateY(0deg);
            }
        }



        @keyframes titleAppear {

            from {
                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(-30px);
            }

            to {
                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0);
            }
        }




        .imageBox:hover {
            z-index: 20;
        }


    </style>
</head>


<body>




    <h1 id="TESTU">
        WELCOME TO OUR BLOG PORTFOLIO
    </h1>




    <video
        autoplay
        muted
        loop
        playsinline
        id="bgvideo">

        <source
            src="S/PREVIEW-Aesthetic-Moon-Ocean.mp4"
            type="video/mp4">

        Your browser does not support the video tag.

    </video>




    <a
        href="Secondpage.html"
        class="imageBox"
        id="imgONE">

        <img
            src="S/us.jpg"
            class="IMGE"
            alt="Image One">

    </a>




    <a
        href="third.html"
        class="imageBox"
        id="imgTWO">

        <img
            src="S/mirror.jpg"
            class="IMGE"
            alt="Image Two">

    </a>




    <a
        href="Fifth.html"
        class="imageBox"
        id="imgTHREE">

        <img
            src="S/video.png"
            class="IMGE"
            alt="Image Three">

    </a>




    <a
        href="Sixth.html"
        class="imageBox"
        id="imgFOUR">

        <img
            src="S/notebook.png"
            class="IMGE"
            alt="Image Four">

    </a>




    <script>

        let images =
            document.querySelectorAll(".IMGE");

        let title =
            document.getElementById("TESTU");




        title.classList.add("GOOGATEST");




        window.addEventListener("load", function() {

            images.forEach(function(image, index) {



                image.parentElement.style.animationDelay =
                    (index * 0.3) + "s";

            });

        });


    </script>


</body>

</html>
